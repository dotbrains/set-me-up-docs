name: CI

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: "0 11 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Lint Markdown files
        run: scripts/validate.sh --markdown

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate shell scripts
        run: scripts/validate.sh --shell

  structure:
    name: Repository Structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate repository structure
        run: scripts/validate.sh --structure

  links:
    name: Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install lychee
        run: |
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.18.1/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin lychee
      - name: Check documentation links
        run: scripts/validate.sh --links

  mermaid:
    name: Mermaid Diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Validate mermaid diagrams
        run: scripts/validate.sh --mermaid

  validate-all:
    name: Native Validator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - markdown-lint
      - shellcheck
      - structure
      - links
      - mermaid
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install validation tools
        run: |
          npm ci
          sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install lychee
        run: |
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.18.1/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin lychee
      - name: Run scripts/validate.sh --all
        run: scripts/validate.sh --all
